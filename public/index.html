<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceHub – Conectando Lugares e Pessoas</title>
    <style>
        :root {
            --primary: #ff385c;
            --dark: #222222;
            --light: #f7f7f7;
            --gray: #717171;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--light);
            color: var(--dark);
            padding-bottom: 60px;
        }

        header {
            background: white;
            padding: 20px;
            border-bottom: 1px solid #ebebeb;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 12px rgba(0, 0, 0, 0.05);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
            cursor: pointer;
        }

        .nav-buttons button {
            background: none;
            border: 1px solid var(--gray);
            padding: 8px 16px;
            border-radius: 21px;
            font-weight: 600;
            cursor: pointer;
            margin-left: 10px;
            transition: 0.2s;
        }

        .nav-buttons button:hover {
            background: #f1f1f1;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .search-container {
            background: white;
            padding: 15px;
            border-radius: 32px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            padding: 5px 20px;
        }

        .search-box label {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--dark);
            letter-spacing: 0.5px;
        }

        .search-box input {
            border: none;
            outline: none;
            font-size: 14px;
            color: var(--gray);
            margin-top: 4px;
            background: transparent;
        }

        .btn-search {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-search:hover {
            background: #e0264c;
        }

        .grid-spaces {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            transition: 0.3s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #ddd;
        }

        .card-content {
            padding: 16px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .card-price {
            font-size: 15px;
            margin-top: 10px;
            font-weight: bold;
            color: var(--primary);
        }

        .card-price span {
            font-weight: normal;
            color: var(--gray);
            font-size: 14px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 16px;
            max-width: 400px;
            width: 90%;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 20px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        .btn-submit {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo" onclick="loadSpaces()">SpaceHub</div>
        <div class="nav-buttons" id="authButtons">
            <button onclick="openModal('loginModal')">Entrar</button>
            <button onclick="openModal('registerModal')">Cadastrar</button>
        </div>
    </header>

    <div class="container">
        <div class="search-container">
            <div class="search-box">
                <label>Onde</label>
                <input type="text" id="searchLocation" placeholder="Buscar destinos ou locais">
            </div>
            <div class="search-box">
                <label>Check-in</label>
                <input type="date" id="searchCheckIn">
            </div>
            <div class="search-box">
                <label>Check-out</label>
                <input type="date" id="searchCheckOut">
            </div>
            <button class="btn-search" onclick="loadSpaces()">Buscar</button>
        </div>

        <h2 style="margin-bottom: 20px;">Espaços Disponíveis</h2>
        <div class="grid-spaces" id="spacesGrid"></div>
    </div>

    <div class="modal" id="loginModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('loginModal')">&times;</span>
            <h3 style="margin-bottom: 20px;">Acessar Conta</h3>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="loginEmail" required>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit" class="btn-submit">Entrar</button>
            </form>
        </div>
    </div>
    <div class="modal" id="registerModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('registerModal')">&times;</span>
            <h3 style="margin-bottom: 20px;">Criar Conta</h3>
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" id="regName" required>
                </div>
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="regEmail" required>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="regPassword" required>
                </div>
                <div class="form-group">
                    <label>Perfil</label>
                    <select id="regRole">
                        <option value="guest">Hóspede (Viajante)</option>
                        <option value="host">Anfitrião (Dono de Imóvel)</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">Cadastrar</button>
            </form>
        </div>
    </div>

    <script>
        // CONFIGURAÇÃO DE URL: 
        // Em testes locais, mantenha 'http://localhost:3000/api'. 
        // Quando seu backend estiver online na Render, substitua pelo link de lá.
        const BASE_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') ?
            'http://localhost:3000' :
            'https://spacehub-cadastro-reservas-production.up.railway.app';

        function openModal(id) {
            document.getElementById(id).style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        async function loadSpaces() {
            try {
                const response = await fetch(`${BASE_URL}/imoveis`);
                const spaces = await response.json();
                const grid = document.getElementById('spacesGrid');
                grid.innerHTML = '';

                if (spaces.length === 0) {
                    grid.innerHTML =
                        '<p style="color: var(--gray); grid-column: 1/-1; text-align: center;">Nenhum imóvel disponível no banco.</p>';
                    return;
                }
                //
                spaces.forEach(space => {
                    grid.innerHTML += `
                        <div class = "card" onclick = "makeBooking(${space.id})">
                        <img src = "${space.image_url || 'https://unsplash.com'} alt = "Imóvel">
                        <div class = "card-content">
                        <div class = "card-title" >${space.title}</div> 
                        <p style = "color: var(--gray); font-size: 14px; margin-bottom: 10px;">${space.description}</p> 
                        <div class = "card-price" > R$ ${space.price_per_night}<span> / noite</span> </div> </div> </div>
                    `;
                });
            } catch (error) {
                console.error('Erro ao buscar imóveis:', error); 
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch(`
                    $ {
                        BASE_URL
                    }
                    /auth/login
                    `, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email,
                        password
                    })
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    alert('Login efetuado com sucesso!');
                    location.reload();
                } else {
                    alert(data.error || 'E-mail ou senha inválidos.');
                }
            } catch (err) {
                alert('Erro na comunicação com o servidor.');
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const role = document.getElementById('regRole').value;

            try {
                const res = await fetch(`
                    $ {
                        BASE_URL
                    }
                    /auth/register
                    `, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name,
                        email,
                        password,
                        role
                    })
                });
                const data = await res.json();

                if (res.ok) {
                    alert('Cadastro realizado com sucesso!');
                    closeModal('registerModal');
                    openModal('loginModal');
                } else {
                    alert(data.error || 'Erro ao cadastrar.');
                }
            } catch (err) {
                alert('Erro na comunicação com o servidor.');
            }
        }

        async function makeBooking(spaceId) {
            const token = localStorage.getItem('token');
            if (!token) {
                alert('Você precisa fazer login para reservar um imóvel!');
                openModal('loginModal');
                return;
            }

            const check_in = document.getElementById('searchCheckIn').value;
            const check_out = document.getElementById('searchCheckOut').value;

            if (!check_in || !check_out) {
                alert(
                    'Selecione as datas de check-in e check-out no topo da página antes de clicar no imóvel para reservar!'
                );
                return;
            }

            try {
                const res = await fetch(`
                    $ {
                        BASE_URL
                    }
                    /reservas`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({
                        space_id: spaceId,
                        check_in,
                        check_out
                    })
                });
                const data = await res.json();

                if (res.ok) {
                    alert('🚀 ' + data.message);
                } else {
                    alert('❌ ' + data.error);
                }
            } catch (err) {
                alert('Erro ao processar reserva.');
            }
        }

        const token = localStorage.getItem('token');
        if (token) {
            document.getElementById('authButtons').innerHTML =
                '<button onclick="localStorage.clear(); location.reload();" style="background: none; border: 1px solid var(--gray); padding: 8px 16px; border-radius: 21px; font-weight: 600; cursor: pointer;">Sair</button>';
        }
        loadSpaces();
    </script>
</body>

</html>

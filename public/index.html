<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceHub - Cadastro e Reservas</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --background: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --gray: #94a3b8;
            --border: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        h1 span {
            color: var(--primary);
        }

        .auth-buttons button {
            background-color: transparent;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            margin-left: 10px;
        }

        .auth-buttons button.primary {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        .auth-buttons button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 20px;
        }

        .card {
            background-color: var(--surface);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card-content {
            padding: 20px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .card-price {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-price span {
            color: var(--gray);
            font-weight: 400;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Space<span>Hub</span></h1>
            <div class="auth-buttons" id="authSection">
                <button onclick="location.href='login.html'">Login</button>
                <button class="primary" onclick="location.href='cadastro.html'">Cadastrar</button>
            </div>
        </header>

        <main>
            <h2 style="margin-bottom: 24px; font-weight: 600;">Imóveis Disponíveis</h2>
            <div class="grid" id="spacesGrid">
                <!-- Os cards de imóveis serão injetados dinamicamente aqui via JavaScript -->
            </div>
        </main>
    </div>

    <script>
        // Definição inteligente da URL Base conectada diretamente com a sua Railway de produção
        const BASE_URL = 'https://railway.app';

        // Executa a busca assim que a página termina de carregar completamente
        document.addEventListener('DOMContentLoaded', () => {
            loadSpaces();
            checkAuth();
        });

        // Função responsável por monitorar o estado de autenticação e alterar o cabeçalho
        function checkAuth() {
            const token = localStorage.getItem('token');
            const authSection = document.getElementById('authSection');
            if (token) {
                authSection.innerHTML = `
                    <button onclick="location.href='historico.html'">Minhas Reservas</button>
                    <button onclick="logout()" style="border-color: #ef4444; color: #ef4444;">Sair</button>
                `;
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.reload();
        }
        // Função responsável por buscar os imóveis e renderizar os cards e imagens na tela
        async function loadSpaces() {
            const grid = document.getElementById('spacesGrid');
            try {
                // Requisição direta para o seu backend oficial na Railway (sem barras duplas)
                const response = await fetch(`${BASE_URL}/imoveis`);

                if (!response.ok) {
                    throw new Error(`Erro do servidor: Status ${response.status}`);
                }

                const spaces = await response.json();

                if (!spaces || spaces.length === 0) {
                    grid.innerHTML =
                        '<p style="color: var(--gray); grid-column: 1/-1; text-align: center;">Nenhum imóvel disponível no momento.</p>';
                    return;
                }

                // Limpa o container antes de injetar os dados atualizados do Supabase
                grid.innerHTML = '';

                // Varredura dos dados recebidos para construir os cards estruturados na tela
                spaces.forEach(space => {
                    // Garante uma imagem padrão de fallback caso a URL do banco esteja vazia
                    const imageUrl = space.image_url || 'https://unsplash.com';

                    grid.innerHTML += `
                        <div class="card" onclick="makeBooking(${space.id})">
                            <img src="${imageUrl}" alt="${space.title}" onerror="this.src='https://unsplash.com'">
                            <div class="card-content">
                                <div class="card-title">${space.title}</div>
                                <p style="color: var(--gray); font-size: 14px; margin-bottom: 18px; line-height: 1.5; height: 42px; overflow: hidden;">${space.description || 'Sem descrição disponível.'}</p>
                                <div class="card-price"> 
                                    <span>Preço por noite</span>
                                    <div>R$ ${Number(space.price_per_night).toFixed(2)}</div>
                                </div>
                            </div>
                        </div>
                    `;
                });

            } catch (error) {
                // Alerta amigável na tela caso o servidor encontre qualquer problema
                alert('Não foi possível carregar os imóveis: ' + error.message);
            }
        }

        // Função chamada ao clicar em um card para iniciar o agendamento da reserva
        function makeBooking(spaceId) {
            const token = localStorage.getItem('token');
            if (!token) {
                alert('Você precisa estar logado para realizar uma reserva!');
                window.location.href = 'login.html';
                return;
            }
            // Guarda o id do imóvel selecionado e redireciona para a página de agendamento
            localStorage.setItem('selectedSpaceId', spaceId);
            window.location.href = 'reserva.html';
        }
    </script>
</body>

</html>
